<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saudades.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Georgia', serif;
            /* Permitir scroll para conteúdo longo */
            overflow-x: hidden;
            overflow-y: auto;
            min-height: 100vh;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            /* Layout otimizado para leitura com padding responsivo */
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            /* Fonte responsiva com clamp */
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 400;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-align: center;
        }

        p {
            /* Fonte menor e otimizada para leitura em todos os dispositivos */
            font-size: clamp(1rem, 2vw, 1.125rem);
            line-height: 1.8;
            text-align: justify;
            margin-bottom: 20px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
        }

        /* Media query para melhor espaçamento em tablets e desktop */
        @media (min-width: 768px) {
            .container {
                padding: 80px 40px;
            }

            p {
                line-height: 2;
            }
        }

        /* Media query para telas muito pequenas */
        @media (max-width: 375px) {
            .container {
                padding: 40px 15px;
            }
        }
    </style>
</head>
<body>
    <canvas id="stars-canvas"></canvas>
    
    <div class="container">
        <h1>Oi.</h1>
        <p>
             Eu só queria dizer que não estou feliz e sinto sua falta. Eu to realizando coisas que eu não queria, você deve saber do que estou falando. Eu sempre vou escolher você, e ainda te espero até hoje pra nós resolver tudo que devemos resolver, inclusive dele.....
        </p>
    </div>

    <script>
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const stars = [];
        const starCount = 200;

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.5;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < starCount; i++) {
            stars.push(new Star());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
